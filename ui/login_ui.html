function fmtDate(v){if(!v)return '—';const d=new Date(v);if(Number.isNaN(d.getTime()))return esc(v);return d.toLocaleString(lang==='ar'?'ar-QA':'en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}function pctClass(p){return p>=80?'bad':p>=55?'warn':''}
function quotaWindow(q,label){if(!q)return `<div class="quota-row"><div class="quota-line"><span>${label}</span><b>—</b></div><div class="bar"><span style="width:0%"></span></div></div>`;const p=Math.max(0,Math.min(100,Number(q.used_percent)||0));const r=fmtDate(q.reset_time);return `<div class="quota-row"><div class="quota-line"><span>${label}</span><b>${tr('used')}: ${p.toFixed(p%1?1:0)}%</b></div><div class="bar"><span class="${pctClass(p)}" style="width:${p}%"></span></div>${q.reset_time?`<div class="reset">${tr('resets')}: ${r}</div>`:''}</div>`}
function quotaBlock(a){if(!a.bound)return `<div class="quota-state">${tr('verifyFirst')}</div>`;const gs=a.quota||[];if(!gs.length){const txt=a.quota_status==='loading'?tr('usageLoading'):a.quota_status==='busy'?tr('usageBusy'):tr('usageUnavailable');return `<div class="quota-state">${txt}${a.quota_error?` · ${esc(msg(a.quota_error))}`:''}</div>`}const warning=(a.quota_stale||a.quota_status!=='ok')?`<div class="quota-state warn">${tr('staleUsage')}${a.quota_error?` · ${esc(msg(a.quota_error))}`:''}</div>`:'';const updated=a.quota_updated_at?`<div class="reset">${tr('updated')}: ${fmtDate(Number(a.quota_updated_at)*1000)}</div>`:'';return `<div class="quota-wrap">${gs.map(g=>`<div class="quota-group"><div class="quota-group-title">${esc(g.label||g.id||'Quota')}</div>${quotaWindow(g.windows?.five_hour,tr('fiveHour'))}${quotaWindow(g.windows?.weekly,tr('weekly'))}</div>`).join('')}${warning}${updated}</div>`}
function accountBadge(a){if(!a.enabled)return `<span class="badge bad">${tr('disabled')}</span>`;if(!a.runtime_available)return `<span class="badge bad">${tr('runtimeUnavailable')}</span>`;if(a.busy){const k=a.busy_kind==='login'?'loginOpen':a.busy_kind==='verify'?'verifyBusy':a.busy_kind==='lane'?'laneBusy':a.busy_kind==='quota'?'quotaBusyBadge':'accountBusy';return `<span class="badge warn">${tr(k)}</span>`}if(a.bound)return `<span class="badge ok">${tr('verifiedBadge')}</span>`;return `<span class="badge">${tr('notLogged')}</span>`}
function renderAccounts(){const q=(document.getElementById('accountSearch')?.value||'').trim().toLowerCase();const rows=(DATA.accounts||[]).filter(a=>!q||String(a.account).toLowerCase().includes(q)||String(a.identity||'').toLowerCase().includes(q));const root=document.getElementById('accountGrid');if(!rows.length){root.innerHTML=`<div class="empty">${tr('emptyAccounts')}</div>`;return}root.innerHTML=rows.map(a=>{const busy=!!a.busy,blocked=!a.enabled||busy||a.action==='verifying';return `<article class="account-card ${a.enabled?'':'off'}"><div class="acct-top"><div class="acct-name"><div class="avatar">●</div><div>${esc(a.account)}</div></div>${accountBadge(a)}</div><div class="identity">${a.identity?esc(a.identity):'—'}</div>${quotaBlock(a)}<div class="acct-actions"><button class="btn" ${blocked?'disabled':''} onclick="act('login','${esc(a.account)}')">${tr('signIn')}</button><button class="btn secondary" ${blocked?'disabled':''} onclick="act('verify','${esc(a.account)}')">${tr('verifyAccount')}</button><button class="btn secondary" ${blocked||!a.bound||a.quota_refreshing?'disabled':''} onclick="act('quota','${esc(a.account)}')">${tr('refreshUsage')}</button><button class="btn ghost" ${busy?'disabled':''} onclick="act('toggle','${esc(a.account)}')">${a.enabled?tr('disable'):tr('enable')}</button></div></article>`}).join('')}
function renderProjects(){const root=document.getElementById('projectRows'),rows=DATA.projects||[];if(!rows.length){root.innerHTML=`<tr><td colspan="7" class="empty">${tr('emptyProjects')}</td></tr>`;return}root.innerHTML=rows.map((p,i)=>`<tr><td>${i+1}</td><td><b>${esc(p.name)}</b></td><td><span class="status"><i class="dot ${esc(p.status)}"></i>${tr(p.status)}</span></td><td>${Number(p.active_lanes)||0}</td><td>${p.task_count??'—'}</td><td>${fmtDate(p.created_at)}</td><td><button class="btn ghost" onclick="projectToggle('${esc(p.name)}')">${tr('toggle')}</button></td></tr>`).join('')}
function renderScheduler(){const s=DATA.scheduler||{};const running=s.status==='running',unavailable=s.status==='unavailable';const badge=document.getElementById('schedulerBadge');badge.className=`badge ${running?'ok':unavailable?'bad':''}`;badge.textContent=tr(unavailable?'unavailable':running?'running':'idle');document.getElementById('schedMode').textContent=tr('roundRobin');const slots=Number(s.per_account_slots),knownSlots=Number.isFinite(slots)&&slots>0;document.getElementById('schedSlots').textContent=knownSlots?slots:'—';document.getElementById('schedAccounts').textContent=unavailable?`— / ${s.verified_accounts??0}`:`${s.active_accounts??0} / ${s.verified_accounts??0}`;document.getElementById('schedProjects').textContent=unavailable?`— / ${s.enabled_projects??0}`:`${s.active_projects??0} / ${s.enabled_projects??0}`;document.getElementById('schedLanes').textContent=unavailable?'—':(s.active_lanes??0);document.getElementById('schedCapacity').textContent=s.capacity??0;const root=document.getElementById('fleetRows');if(unavailable){root.innerHTML=`<div class="quota-state">${tr('runtimeUnavailable')}</div>`;return}const laneMap=s.account_lanes||{},accounts=(DATA.accounts||[]).filter(a=>a.enabled&&a.bound);root.innerHTML=accounts.map(a=>{const n=Number(laneMap[a.account])||0;const w=knownSlots?Math.min(100,n/slots*100):0;return `<div class="fleet-row"><span>${esc(a.account)}</span><div class="mini"><span style="width:${w}%"></span></div><b>${n}/${knownSlots?slots:'—'}</b></div>`}).join('')||'<div class="quota-state">—</div>'}
function renderStats(){const s=DATA.stats||{};document.getElementById('statAccounts').textContent=s.total_accounts??0;document.getElementById('statVerified').textContent=s.verified_accounts??0;document.getElementById('statProjects').textContent=s.enabled_projects??0;document.getElementById('statCapacity').textContent=`${s.logical_capacity??0} lanes`}
function renderAll(){renderStats();renderAccounts();renderProjects();renderScheduler()}
async function refresh(){if(refreshBusy)return;refreshBusy=true;try{const r=await fetch('/api/status',{cache:'no-store',headers:{'X-UI-Token':TOKEN}});if(!r.ok)throw new Error('status');DATA=await r.json();renderAll()}catch(e){showToast('offline')}finally{refreshBusy=false}}
function focusAddAccount(){document.getElementById('accountInput').focus()}async function addAccount(){const input=document.getElementById('accountInput'),account=input.value.trim();if(!account)return;try{const r=await fetch('/api/add',{method:'POST',headers:{'Content-Type':'application/json','X-UI-Token':TOKEN},body:JSON.stringify({account})});const d=await r.json();showToast(d.message||'actionFailed');if(r.ok)input.value='';refresh()}catch(e){showToast('actionFailed')}}
async function act(action,account){try{const r=await fetch(`/api/${action}/${encodeURIComponent(account)}`,{method:'POST',headers:{'X-UI-Token':TOKEN}});const d=await r.json();showToast(d.message||'actionFailed');refresh()}catch(e){showToast('actionFailed')}}
function toggleProjectForm(){document.getElementById('projectForm').classList.toggle('show')}async function addProject(){const body={name:document.getElementById('projectName').value.trim(),repo:document.getElementById('projectRepo').value.trim(),plan:document.getElementById('projectPlan').value.trim(),model:document.getElementById('projectModel').value.trim(),goal:document.getElementById('projectGoal').value.trim()};if(!body.name||!body.repo||!body.plan)return showToast('actionFailed');try{const r=await fetch('/api/project-add',{method:'POST',headers:{'Content-Type':'application/json','X-UI-Token':TOKEN},body:JSON.stringify(body)});const d=await r.json();showToast(d.message||'actionFailed');if(r.ok){['projectName','projectRepo','projectPlan','projectModel','projectGoal'].forEach(id=>document.getElementById(id).value='');document.getElementById('projectForm').classList.remove('show')}refresh()}catch(e){showToast('actionFailed')}}
async function projectToggle(name){try{const r=await fetch(`/api/project-toggle/${encodeURIComponent(name)}`,{method:'POST',headers:{'X-UI-Token':TOKEN}});const d=await r.json();showToast(d.message||'actionFailed');refresh()}catch(e){showToast('actionFailed')}}
setLang(lang);refresh();setInterval(refresh,5000);
</script>
</body>
